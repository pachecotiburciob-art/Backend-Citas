<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Médico - Dashboard Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- Barra de Navegación Superior -->
  <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-blue-600 text-white rounded-lg flex items-center justify-center font-bold shadow">
          🏥
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-800 leading-tight">Clínica Médica</h1>
          <p class="text-xs text-slate-500">Sistema de Gestión Institucional</p>
        </div>
      </div>

      <!-- Datos del Usuario Logueado -->
      <div class="flex items-center space-x-4">
        <div class="text-right hidden sm:block">
          <p id="user-name" class="text-sm font-bold text-slate-800">Cargando...</p>
          <span id="user-role" class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-blue-100 text-blue-800">
            ---
          </span>
        </div>
        <button onclick="logout()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-lg transition border border-slate-200">
          Cerrar Sesión
        </button>
      </div>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">

    <!-- Tarjetas de Estadísticas / KPIs -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-500">Total de Citas</p>
          <h3 id="kpi-total" class="text-2xl font-black text-slate-800 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl font-bold">
          📊
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-500">Pendientes</p>
          <h3 id="kpi-pending" class="text-2xl font-black text-amber-600 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl font-bold">
          ⏳
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-500">Confirmadas</p>
          <h3 id="kpi-confirmed" class="text-2xl font-black text-emerald-600 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl font-bold">
          ✅
        </div>
      </div>
    </div>

    <!-- Grid de Formulario y Listado -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Columna Izquierda: Formulario (Sólo visible para Pacientes) -->
      <div id="patient-form-section" class="lg:col-span-1">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sticky top-24">
          <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
            <span>📅 Agendar Cita Médica</span>
          </h2>

          <form onsubmit="createAppointment(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Seleccionar Médico</label>
              <select id="doctor_select" required class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                <option value="">Cargando médicos...</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Fecha y Hora</label>
              <input type="datetime-local" id="appointment_date" required class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Motivo de Consulta</label>
              <textarea id="reason" required rows="3" placeholder="Describe brevemente tus síntomas..." class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none"></textarea>
            </div>

            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition duration-200 text-sm">
              Confirmar Cita
            </button>
          </form>
        </div>
      </div>

      <!-- Columna Derecha: Listado de Citas -->
      <div id="appointments-section" class="lg:col-span-2 space-y-4">
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
          <div>
            <h2 class="text-lg font-bold text-slate-800">Gestión de Citas</h2>
            <p class="text-xs text-slate-500">Monitoreo de estado y agenda en tiempo real</p>
          </div>
          
          <!-- Filtros de Estado -->
          <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg text-xs font-semibold">
            <button onclick="filterAppointments('all')" class="px-2.5 py-1 rounded-md bg-white text-slate-800 shadow-sm">Todas</button>
            <button onclick="filterAppointments('pending')" class="px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900">Pendientes</button>
            <button onclick="filterAppointments('confirmed')" class="px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900">Confirmadas</button>
            <button onclick="filterAppointments('cancelled')" class="px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900">Canceladas</button>
          </div>
        </div>

        <!-- Tarjetas de Citas -->
        <div id="appointments-list" class="space-y-3">
          <!-- Se insertan con JavaScript -->
        </div>
      </div>

    </div>

  </main>

  <script>
    // URL base automática para desarrollo local y producción en Render
    const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:4000'
      : 'https://backend-citas-2vxk.onrender.com';

    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';

    let allAppointments = [];

    // Bloquear fechas pasadas en el selector de fecha
    const nowISO = new Date().toISOString().slice(0, 16);
    const dateInput = document.getElementById('appointment_date');
    if (dateInput) {
      dateInput.min = nowISO;
    }

    // Decodificar JWT
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    const userData = parseJwt(token);

    if (userData) {
      document.getElementById('user-name').innerText = userData.name || userData.email || 'Usuario';
      document.getElementById('user-role').innerText = userData.role || 'Paciente';

      if (userData.role === 'doctor') {
        document.getElementById('patient-form-section').classList.add('hidden');
        document.getElementById('appointments-section').classList.remove('lg:col-span-2');
        document.getElementById('appointments-section').classList.add('lg:col-span-3');
      }
    }

    // Cargar Lista de Médicos
    async function loadDoctors() {
      try {
        const res = await fetch(`${API_URL}/api/auth/doctors`);
        const data = await res.json();
        const select = document.getElementById('doctor_select');

        if (data.doctors && data.doctors.length > 0) {
          select.innerHTML = '<option value="">-- Selecciona un Médico --</option>';
          data.doctors.forEach(doc => {
            select.innerHTML += `<option value="${doc.id}">${doc.name} (${doc.email})</option>`;
          });
        } else {
          select.innerHTML = '<option value="">No hay médicos disponibles</option>';
        }
      } catch (err) {
        console.error('Error al cargar médicos:', err);
      }
    }

    // Cargar Citas y actualizar métricas
    async function loadAppointments() {
      try {
        const res = await fetch(`${API_URL}/api/appointments`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        allAppointments = data.appointments || [];
        
        updateKPIs(allAppointments);
        renderAppointments(allAppointments);
      } catch (err) {
        console.error('Error al cargar citas:', err);
      }
    }

    // Actualizar Estadísticas (KPIs)
    function updateKPIs(appointments) {
      const total = appointments.length;
      const pending = appointments.filter(a => a.status === 'pending').length;
      const confirmed = appointments.filter(a => a.status === 'confirmed').length;

      document.getElementById('kpi-total').innerText = total;
      document.getElementById('kpi-pending').innerText = pending;
      document.getElementById('kpi-confirmed').innerText = confirmed;
    }

    // Renderizar tarjetas de citas
    function renderAppointments(appointments) {
      const list = document.getElementById('appointments-list');
      list.innerHTML = '';

      if (appointments.length > 0) {
        appointments.forEach(app => {
          const dateStr = new Date(app.start_datetime).toLocaleString('es-ES', {
            dateStyle: 'medium',
            timeStyle: 'short'
          });

          let statusColor = 'bg-amber-100 text-amber-800 border-amber-200';
          if (app.status === 'confirmed') statusColor = 'bg-blue-100 text-blue-800 border-blue-200';
          if (app.status === 'completed') statusColor = 'bg-emerald-100 text-emerald-800 border-emerald-200';
          if (app.status === 'cancelled') statusColor = 'bg-red-100 text-red-800 border-red-200';

          let actionButtons = '';
          if (userData && userData.role === 'doctor') {
            actionButtons = `
              <div class="flex gap-2">
                <button onclick="updateStatus(${app.id}, 'confirmed')" class="px-3 py-1 bg-blue-600 text-white text-xs font-semibold rounded-lg hover:bg-blue-700 transition">Confirmar</button>
                <button onclick="updateStatus(${app.id}, 'completed')" class="px-3 py-1 bg-emerald-600 text-white text-xs font-semibold rounded-lg hover:bg-emerald-700 transition">Completar</button>
              </div>
            `;
          } else {
            actionButtons = `
              <button onclick="deleteAppointment(${app.id})" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold rounded-lg transition border border-red-200">
                Cancelar Cita
              </button>
            `;
          }

          list.innerHTML += `
            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between md:items-center gap-4 hover:shadow-md transition">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-0.5 rounded-full text-xs font-bold uppercase border ${statusColor}">
                    ${app.status}
                  </span>
                  <span class="text-xs text-slate-400 font-semibold">Cita #${app.id}</span>
                </div>
                <p class="text-sm font-bold text-slate-800">Médico ID: ${app.doctor_id} | Paciente ID: ${app.patient_id || 'Mío'}</p>
                <p class="text-sm text-slate-600"><b>Motivo:</b> ${app.reason}</p>
                <p class="text-xs text-blue-600 font-semibold">📅 ${dateStr}</p>
              </div>
              <div>
                ${actionButtons}
              </div>
            </div>
          `;
        });
      } else {
        list.innerHTML = `
          <div class="bg-white rounded-xl p-8 border border-slate-200 text-center text-slate-400">
            <p class="text-base font-medium">No se encontraron citas.</p>
          </div>
        `;
      }
    }

    // Filtrar Citas por Estado
    function filterAppointments(status) {
      if (status === 'all') {
        renderAppointments(allAppointments);
      } else {
        const filtered = allAppointments.filter(app => app.status === status);
        renderAppointments(filtered);
      }
    }

    // Cambiar estado de la cita
    async function updateStatus(id, newStatus) {
      try {
        await fetch(`${API_URL}/api/appointments/${id}/status`, {
          method: 'PUT',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({ status: newStatus })
        });
        loadAppointments();
      } catch (err) {
        alert('Error al actualizar el estado');
      }
    }

    // Agendar Cita
    async function createAppointment(e) {
      e.preventDefault();
      const doctor_id = document.getElementById('doctor_select').value;
      const appointment_date = document.getElementById('appointment_date').value.replace('T', ' ') + ':00';
      const reason = document.getElementById('reason').value;

      if (!doctor_id) {
        alert('Por favor selecciona un médico de la lista.');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/appointments`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ doctor_id, appointment_date, reason })
        });

        const data = await res.json();

        if (res.ok) {
          document.getElementById('reason').value = '';
          loadAppointments();
        } else {
          alert('Error: ' + (data.message || 'No se pudo agendar la cita.'));
        }
      } catch (err) {
        alert('Ocurrió un error al intentar guardar la cita.');
      }
    }

    // Cancelar Cita
    async function deleteAppointment(id) {
      if (confirm('¿Estás seguro de que deseas cancelar esta cita?')) {
        await fetch(`${API_URL}/api/appointments/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        loadAppointments();
      }
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = 'index.html';
    }

    // Inicializar
    loadDoctors();
    loadAppointments();
  </script>
</body>
</html>
