<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Clínica Médica</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">

    <!-- Encabezado -->
    <header class="bg-white shadow-md rounded-2xl p-4 mb-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-50 text-blue-600 p-2.5 rounded-xl">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-800">Clínica Médica</h1>
                <p id="welcomeUser" class="text-xs text-slate-500">Sistema de Gestión Institucional</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="text-right hidden sm:block">
                <span class="block text-xs font-bold uppercase text-slate-400">Usuario</span>
                <span id="userRoleBadge" class="inline-block px-2.5 py-0.5 text-xs font-semibold bg-blue-50 text-blue-600 rounded-full uppercase">CARGANDO...</span>
            </div>
            <button onclick="cerrarSesion()" class="bg-red-50 hover:bg-red-100 text-red-600 text-sm font-medium px-4 py-2 rounded-xl transition duration-200">
                Cerrar Sesión
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Sección Formulario (Visible solo para Pacientes) -->
        <section id="sectionPaciente" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 lg:col-span-1">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <span>📅</span> Agendar Cita Médica
            </h2>

            <div id="alertaDashboard" class="hidden mb-4 p-3 rounded-lg text-sm text-center font-medium"></div>

            <form id="formCita" class="space-y-4" onsubmit="agendarCita(event)">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Seleccionar Médico</label>
                    <select id="selectMedico" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                        <option value="">Cargando médicos...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Fecha y Hora</label>
                    <!-- Restricción min para bloquear días y horas pasadas -->
                    <input type="datetime-local" id="fechaCita" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Motivo de Consulta</label>
                    <textarea id="motivoCita" rows="3" required placeholder="Describe brevemente tus síntomas..." class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                    Confirmar Cita
                </button>
            </form>
        </section>

        <!-- Listado y Estado de Citas -->
        <section id="sectionListado" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 lg:col-span-2">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">Gestión de Citas</h2>
                    <p class="text-xs text-slate-500">Monitoreo de agenda en tiempo real</p>
                </div>
            </div>

            <!-- Tarjetas de Resumen -->
            <div class="grid grid-cols-3 gap-4 mb-6">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center">
                    <span class="block text-xs font-bold uppercase text-slate-400 mb-1">Total</span>
                    <span id="totalCitas" class="text-xl font-bold text-slate-800">0</span>
                </div>
                <div class="bg-amber-50 p-4 rounded-xl border border-amber-100 text-center">
                    <span class="block text-xs font-bold uppercase text-amber-600 mb-1">Pendientes</span>
                    <span id="citasPendientes" class="text-xl font-bold text-amber-700">0</span>
                </div>
                <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100 text-center">
                    <span class="block text-xs font-bold uppercase text-emerald-600 mb-1">Confirmadas</span>
                    <span id="citasConfirmadas" class="text-xl font-bold text-emerald-700">0</span>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-400 uppercase text-xs">
                            <th class="py-3 px-4">Médico / Paciente</th>
                            <th class="py-3 px-4">Fecha</th>
                            <th class="py-3 px-4">Motivo</th>
                            <th class="py-3 px-4">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCitasBody">
                        <tr>
                            <td colspan="4" class="text-center py-6 text-slate-400">No hay citas registradas aún.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        const API_URL = "https://backend-citas-production-b607.up.railway.app";
        const token = localStorage.getItem('token');
        const userRole = localStorage.getItem('userRole') || 'patient';
        const userName = localStorage.getItem('userName') || 'Usuario';

        if (!token) {
            window.location.href = 'index.html';
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('userRoleBadge').textContent = userRole === 'doctor' ? 'Médico' : 'Paciente';
            document.getElementById('welcomeUser').textContent = `Bienvenido, ${userName}`;

            // Configurar fecha mínima en el input para bloquear días y horas pasadas
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('fechaCita').min = now.toISOString().slice(0, 16);

            if (userRole === 'doctor') {
                document.getElementById('sectionPaciente').style.display = 'none';
                document.getElementById('sectionListado').classList.remove('lg:col-span-2');
                document.getElementById('sectionListado').classList.add('lg:col-span-3');
            } else {
                cargarMedicos();
            }

            cargarCitas();
        });

        async function cargarMedicos() {
            const select = document.getElementById('selectMedico');
            try {
                const response = await fetch(`${API_URL}/api/auth/doctors`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const medicos = await response.json();
                select.innerHTML = '<option value="">Selecciona un médico</option>';

                if (Array.isArray(medicos) && medicos.length > 0) {
                    medicos.forEach(medico => {
                        select.innerHTML += `<option value="${medico._id}">Dr. ${medico.name}</option>`;
                    });
                } else {
                    select.innerHTML = '<option value="">No hay médicos disponibles</option>';
                }
            } catch (error) {
                console.error("Error al obtener médicos:", error);
                select.innerHTML = '<option value="">Error al cargar médicos</option>';
            }
        }

        async function cargarCitas() {
            try {
                const response = await fetch(`${API_URL}/api/appointments`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const citas = await response.json();

                const tbody = document.getElementById('tablaCitasBody');
                const totalCitasEl = document.getElementById('totalCitas');
                const citasPendientesEl = document.getElementById('citasPendientes');
                const citasConfirmadasEl = document.getElementById('citasConfirmadas');

                if (Array.isArray(citas) && citas.length > 0) {
                    totalCitasEl.textContent = citas.length;
                    let pendientes = 0;
                    let confirmadas = 0;

                    tbody.innerHTML = '';
                    citas.forEach(cita => {
                        if (cita.status === 'confirmed') confirmadas++;
                        else pendientes++;

                        const fechaFormateada = new Date(cita.date).toLocaleString();
                        const nombreContraparte = userRole === 'doctor' 
                            ? (cita.patient ? cita.patient.name : 'Paciente') 
                            : (cita.doctor ? `Dr. ${cita.doctor.name}` : 'Médico');

                        tbody.innerHTML += `
                            <tr class="border-b border-slate-100 hover:bg-slate-50">
                                <td class="py-3 px-4 font-medium text-slate-800">${nombreContraparte}</td>
                                <td class="py-3 px-4 text-slate-600">${fechaFormateada}</td>
                                <td class="py-3 px-4 text-slate-600">${cita.reason}</td>
                                <td class="py-3 px-4">
                                    <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${cita.status === 'confirmed' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">
                                        ${cita.status === 'confirmed' ? 'Confirmada' : 'Pendiente'}
                                    </span>
                                </td>
                            </tr>
                        `;
                    });

                    citasPendientesEl.textContent = pendientes;
                    citasConfirmadasEl.textContent = confirmadas;
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-400">No hay citas registradas aún.</td></tr>`;
                    totalCitasEl.textContent = '0';
                    citasPendientesEl.textContent = '0';
                    citasConfirmadasEl.textContent = '0';
                }
            } catch (error) {
                console.error("Error al cargar citas:", error);
            }
        }

        function showAlert(message, isError = true) {
            const alerta = document.getElementById('alertaDashboard');
            alerta.textContent = message;
            alerta.className = `mb-4 p-3 rounded-lg text-sm text-center font-medium ${isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200'}`;
            alerta.classList.remove('hidden');
        }

        async function agendarCita(event) {
            event.preventDefault();
            const doctor = document.getElementById('selectMedico').value;
            const date = document.getElementById('fechaCita').value;
            const reason = document.getElementById('motivoCita').value;

            try {
                const response = await fetch(`${API_URL}/api/appointments`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ doctor, date, reason })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert("¡Cita agendada con éxito!", false);
                    document.getElementById('formCita').reset();
                    cargarCitas();
                } else {
                    showAlert(data.message || "Error al agendar cita");
                }
            } catch (error) {
                showAlert("Error de conexión con el servidor");
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
