<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Citas Médicas - Acceso</title>
    <!-- Tailwind CSS para mantener tu diseño original -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        
        <div class="flex justify-center mb-4">
            <div class="bg-blue-50 text-blue-600 p-3 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-center text-slate-800 mb-1">Bienvenido</h2>
        <p class="text-center text-slate-500 text-sm mb-6">Ingresa tus credenciales para acceder</p>

        <!-- Pestañas de Navegación -->
        <div class="flex border-b border-slate-200 mb-6">
            <button id="tabLogin" onclick="switchTab('login')" class="flex-1 pb-2 font-medium text-blue-600 border-b-2 border-blue-600 text-center transition-colors">Iniciar Sesión</button>
            <button id="tabRegister" onclick="switchTab('register')" class="flex-1 pb-2 font-medium text-slate-400 border-b-2 border-transparent text-center transition-colors">Registrarse</button>
        </div>

        <!-- Mensaje de Estado / Alerta -->
        <div id="alerta" class="hidden mb-4 p-3 rounded-lg text-sm text-center font-medium"></div>

        <!-- Formulario de Iniciar Sesión -->
        <form id="formLogin" class="space-y-4" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Correo Electrónico</label>
                <input type="email" id="loginEmail" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Contraseña</label>
                <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                Entrar al Sistema
            </button>
        </form>

        <!-- Formulario de Registro -->
        <form id="formRegister" class="space-y-4 hidden" onsubmit="handleRegister(event)">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Nombre Completo</label>
                <input type="text" id="regName" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Correo Electrónico</label>
                <input type="email" id="regEmail" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Contraseña</label>
                <input type="password" id="regPassword" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                Crear Cuenta
            </button>
        </form>

    </div>

    <script>
        // URL pública de tu backend en Railway
        const API_URL = "https://backend-citas-production-b607.up.railway.app";

        function switchTab(tab) {
            const loginTab = document.getElementById('tabLogin');
            const registerTab = document.getElementById('tabRegister');
            const formLogin = document.getElementById('formLogin');
            const formRegister = document.getElementById('formRegister');
            hideAlert();

            if (tab === 'login') {
                loginTab.className = "flex-1 pb-2 font-medium text-blue-600 border-b-2 border-blue-600 text-center transition-colors";
                registerTab.className = "flex-1 pb-2 font-medium text-slate-400 border-b-2 border-transparent text-center transition-colors";
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
            } else {
                registerTab.className = "flex-1 pb-2 font-medium text-blue-600 border-b-2 border-blue-600 text-center transition-colors";
                loginTab.className = "flex-1 pb-2 font-medium text-slate-400 border-b-2 border-transparent text-center transition-colors";
                formRegister.classList.remove('hidden');
                formLogin.classList.add('hidden');
            }
        }

        function showAlert(message, isError = true) {
            const alerta = document.getElementById('alerta');
            alerta.textContent = message;
            alerta.className = `mb-4 p-3 rounded-lg text-sm text-center font-medium ${isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200'}`;
            alerta.classList.remove('hidden');
        }

        function hideAlert() {
            document.getElementById('alerta').classList.add('hidden');
        }

        // Petición para Iniciar Sesión
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert("¡Inicio de sesión exitoso! Redirigiendo...", false);
                    // Guardar token si lo usas y redirigir al panel o dashboard
                    localStorage.setItem('token', data.token);
                    setTimeout(() => {
                        window.location.href = 'dashboard.html'; // O cámbialo a tu vista principal
                    }, 1000);
                } else {
                    showAlert(data.message || "Credenciales incorrectas");
                }
            } catch (error) {
                showAlert("Error de conexión con el servidor de Railway");
            }
        }

        // Petición para Registrarse (envía 'name' como lo exige Mongoose)
        async function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert("¡Cuenta creada con éxito! Ahora puedes iniciar sesión.", false);
                    document.getElementById('formRegister').reset();
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    showAlert(data.error || data.message || "Error al registrarse");
                }
            } catch (error) {
                showAlert("Error de conexión con el servidor de Railway");
            }
        }
    </script>
</body>
</html>
