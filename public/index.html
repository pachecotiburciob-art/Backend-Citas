<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Médico - Iniciar Sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border border-slate-200">
    <!-- Encabezado -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800" id="form-title">Bienvenido</h1>
      <p class="text-slate-500 text-sm mt-1" id="form-subtitle">Ingresa tus credenciales para acceder</p>
    </div>

    <!-- Pestañas para cambiar entre Login y Registro -->
    <div class="flex border-b border-slate-200 mb-6">
      <button id="tab-login" onclick="switchTab('login')" class="flex-1 pb-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition">Iniciar Sesión</button>
      <button id="tab-register" onclick="switchTab('register')" class="flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent transition">Registrarse</button>
    </div>

    <!-- Mensaje de Estado -->
    <div id="msg" class="hidden mb-4 p-3 rounded-lg text-sm font-medium text-center"></div>

    <!-- Formulario de Login -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Correo Electrónico</label>
        <input type="email" id="login-email" required placeholder="correo@ejemplo.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Contraseña</label>
        <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
      </div>
      <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition duration-200">Entrar al Sistema</button>
    </form>

    <!-- Formulario de Registro -->
    <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre Completo</label>
        <input type="text" id="reg-name" required placeholder="Ej. Juan Pérez" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Correo Electrónico</label>
        <input type="email" id="reg-email" required placeholder="correo@ejemplo.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Contraseña</label>
        <input type="password" id="reg-password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
      </div>
      <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition duration-200">Crear Cuenta</button>
    </form>
  </div>

  <script>
    // Configuración dinámica de la URL del API
    const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:4000'
      : 'https://backend-citas-2vxk.onrender.com';

    let currentMode = 'login';

    function switchTab(mode) {
      currentMode = mode;
      const msg = document.getElementById('msg');
      msg.classList.add('hidden');

      if (mode === 'login') {
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('register-form').classList.add('hidden');
        document.getElementById('tab-login').className = "flex-1 pb-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition";
        document.getElementById('tab-register').className = "flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent transition";
        document.getElementById('form-title').innerText = "Bienvenido";
        document.getElementById('form-subtitle').innerText = "Ingresa tus credenciales para acceder";
      } else {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('register-form').classList.remove('hidden');
        document.getElementById('tab-register').className = "flex-1 pb-3 text-sm font-semibold text-emerald-600 border-b-2 border-emerald-600 transition";
        document.getElementById('tab-login').className = "flex-1 pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent transition";
        document.getElementById('form-title').innerText = "Registro de Usuario";
        document.getElementById('form-subtitle').innerText = "Completa tus datos para crear una cuenta";
      }
    }

    function showMsg(text, isError = true) {
      const msg = document.getElementById('msg');
      msg.innerText = text;
      msg.className = `mb-4 p-3 rounded-lg text-sm font-medium text-center ${isError ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          window.location.href = 'dashboard.html';
        } else {
          showMsg(data.message || 'Credenciales inválidas');
        }
      } catch (err) {
        showMsg('Error de conexión con el servidor');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      try {
        const res = await fetch(`${API_URL}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role: 'patient' })
        });
        const data = await res.json();

        if (res.ok) {
          showMsg('¡Cuenta creada exitosamente! Ahora inicia sesión.', false);
          setTimeout(() => switchTab('login'), 1500);
        } else {
          showMsg(data.message || 'Error al registrar usuario');
        }
      } catch (err) {
        showMsg('Error de conexión con el servidor');
      }
    }
  </script>
</body>
</html>
